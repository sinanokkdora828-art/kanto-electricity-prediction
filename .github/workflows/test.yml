name: Python Test

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */6 * * *"

jobs:
  run-python:
    runs-on: ubuntu-latest

    steps:
      # ① GitHubのコードを取得
      - name: Checkout
        uses: actions/checkout@v4

      # ② Pythonを準備
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ③ 日本語フォントをインストール
      - name: Install Japanese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      # ④ ライブラリをインストール
      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      # ⑤ Pythonを実行
      - name: Run Python
        run: |
          python main.py
