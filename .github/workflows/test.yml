name: 関東電力需要予測

on:

  workflow_dispatch:

  schedule:
    - cron: "0 */6 * * *"


jobs:

  predict:

    runs-on: ubuntu-latest


    steps:

      # ==========================================
      # ① GitHubリポジトリを取得
      # ==========================================

      - name: リポジトリを取得

        uses: actions/checkout@v4


      # ==========================================
      # ② Pythonをセットアップ
      # ==========================================

      - name: Pythonをセットアップ

        uses: actions/setup-python@v5

        with:
          python-version: "3.12"


      # ==========================================
      # ③ 日本語フォントをインストール
      # ==========================================

      - name: 日本語フォントをインストール

        run: |

          sudo apt-get update

          sudo apt-get install -y fonts-noto-cjk


      # ==========================================
      # ④ Pythonライブラリをインストール
      # ==========================================

      - name: Pythonライブラリをインストール

        run: |

          python -m pip install --upgrade pip

          pip install -r requirements.txt


      # ==========================================
      # ⑤ 電力需要予測を実行
      # ==========================================

      - name: 電力需要予測を実行

        run: |

          python main.py


      # ==========================================
      # ⑥ GitHub Pages用ファイルを確認
      # ==========================================

      - name: Pages用ファイルを確認

        run: |

          echo "=========================================="

          echo "docsフォルダ"

          echo "=========================================="

          find docs -maxdepth 3 -type f -print

          echo ""

          echo "=========================================="

          echo "resultsフォルダ"

          echo "=========================================="

          find results -maxdepth 2 -type f -print


      # ==========================================
      # ⑦ GitHub Pagesへ渡すファイルを保存
      # ==========================================

      - name: GitHub Pages用ファイルをアップロード

        uses: actions/upload-pages-artifact@v3

        with:

          path: ./docs


      # ==========================================
      # ⑧ GitHub Pagesへ公開
      # ==========================================

      - name: GitHub Pagesへデプロイ

        id: deployment

        uses: actions/deploy-pages@v4
