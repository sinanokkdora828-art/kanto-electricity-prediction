name: 関東電力需要予測

# ==========================================
# 実行するタイミング
# ==========================================

on:

  # GitHub上から手動実行
  workflow_dispatch:

  # 6時間ごとに自動実行
  schedule:
    - cron: "0 */6 * * *"


# ==========================================
# GitHub Actionsの処理
# ==========================================

jobs:

  predict:

    # Ubuntu環境で実行
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # ① GitHubのリポジトリを取得
      # ==========================================

      - name: リポジトリを取得
        uses: actions/checkout@v4


      # ==========================================
      # ② Pythonをセットアップ
      # ==========================================

      - name: Pythonをセットアップ
        uses: actions/setup-python@v5

        with:
          python-version: "3.12"


      # ==========================================
      # ③ Pythonライブラリをインストール
      # ==========================================

      - name: Pythonライブラリをインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # ==========================================
      # ④ 日本語フォントをインストール
      # ==========================================

      - name: 日本語フォントをインストール
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk


      # ==========================================
      # ⑤ Pythonプログラムを実行
      # ==========================================

      - name: 電力需要予測を実行
        run: |
          python main.py


      # ==========================================
      # ⑥ 生成されたファイルを確認
      # ==========================================

      - name: 生成ファイルを確認
        run: |
          echo "=========================================="
          echo "生成されたファイル"
          echo "=========================================="

          find results -maxdepth 2 -type f -print || true

          echo ""
          echo "prediction.csv"
          ls -lh prediction.csv || true


      # ==========================================
      # ⑦ 予測結果・画像をArtifactsとして保存
      # ==========================================

      - name: 予測結果を保存
        uses: actions/upload-artifact@v4

        with:

          # GitHub Actions上で表示される名前
          name: kanto-electricity-prediction

          # 保存するファイル
          path: |
            prediction.csv
            results/temperature_demand_quadratic.png
            results/kanto_electricity_prediction.png

          # ファイルがなくてもエラーにしない
          if-no-files-found: warn
