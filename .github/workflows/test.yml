name: Run electricity prediction

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Japanese font
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Install libraries
        run: |
          pip install -r requirements.txt

      - name: Run Python
        run: |
          python main.py

      - name: Upload graph
        uses: actions/upload-artifact@v4
        with:
          name: temperature-demand-graph
          path: results/temperature_demand_quadratic.png
