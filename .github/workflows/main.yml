name: 関東電力需要予測テスト

on:
  workflow_dispatch:

jobs:

  test:

    runs-on: ubuntu-latest

    steps:

      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pythonのバージョン確認
        run: |
          python --version

      - name: ファイル確認
        run: |
          echo "=========================================="
          echo "リポジトリのファイル"
          echo "=========================================="

          find . -maxdepth 2 -type f | sort

      - name: テスト完了
        run: |
          echo "=========================================="
          echo "GitHub Actionsのテストに成功しました"
          echo "=========================================="
