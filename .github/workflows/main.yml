name: 関東電力需要予測

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  predict:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 日本語フォントをインストール
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Pythonライブラリをインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 電力需要予測を実行
        run: |
          python main.py

      - name: 生成されたファイルを確認
        run: |
          echo "=========================================="
          echo "docsフォルダ"
          echo "=========================================="
          find docs -maxdepth 3 -type f -print

          echo ""
          echo "=========================================="
          echo "予測画像"
          echo "=========================================="
          ls -lh docs/results/kanto_electricity_prediction.png

      - name: GitHub Pagesを設定
        uses: actions/configure-pages@v5

      - name: GitHub Pages用ファイルをアップロード
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

      - name: GitHub Pagesへデプロイ
        id: deployment
        uses: actions/deploy-pages@v4
