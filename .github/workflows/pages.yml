name: GitHub Pages

on:
  workflow_dispatch:

  push:
    branches:
      - main


# GitHub Pagesへの公開に必要
permissions:
  contents: read
  pages: write
  id-token: write


jobs:

  deploy:

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      # ==========================================
      # ① リポジトリを取得
      # ==========================================

      - name: リポジトリを取得
        uses: actions/checkout@v4


      # ==========================================
      # ② GitHub Pagesの設定
      # ==========================================

      - name: GitHub Pagesを設定
        uses: actions/configure-pages@v5


      # ==========================================
      # ③ docsフォルダをPages用データとして登録
      # ==========================================

      - name: GitHub Pages用ファイルをアップロード
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs


      # ==========================================
      # ④ GitHub Pagesへ公開
      # ==========================================

      - name: GitHub Pagesへデプロイ
        id: deployment
        uses: actions/deploy-pages@v4
