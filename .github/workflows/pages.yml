name: GitHub Pages

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:

  deploy:

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: GitHub Pagesを設定
        uses: actions/configure-pages@v5

      - name: GitHub Pages用ファイルをアップロード
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

      - name: GitHub Pagesへデプロイ
        id: deployment
        uses: actions/deploy-pages@v4
